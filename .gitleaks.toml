# gitleaks configuration for campbell-property-management-hoa-cli.
#
# This tool hardcodes no secrets. The portal password and cached bearer token
# exist only in the OS keychain at runtime; test fixtures are scrubbed of real
# values (see tests/fixtures/README.md). So we extend the default ruleset with
# no allowlisted secrets. If gitleaks flags something, it's a real finding:
# remove it, don't allowlist it.

[extend]
useDefault = true
