[package]
name = "campbell-property-management-hoa-cli"
version = "0.2.4"
edition = "2021"
# pk-cli-auth (cli-common v0.27.0) needs 1.89.
rust-version = "1.89"
description = "Campbell Property Management (Vantaca) HOA homeowner portal from the command line — Keychain-secured, agent-friendly. Unofficial."
license = "MIT OR Apache-2.0"
repository = "https://github.com/piekstra/campbell-property-management-hoa-cli"
homepage = "https://github.com/piekstra/campbell-property-management-hoa-cli"
readme = "README.md"
keywords = ["vantaca", "hoa", "property-management", "homeowner-portal", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "cpmfl"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pk-cli-core = { git = "https://github.com/piekstra/cli-common", tag = "v0.29.0", features = ["reqwest"] }
pk-cli-secrets = { git = "https://github.com/piekstra/cli-common", tag = "v0.29.0" }
pk-cli-config = { git = "https://github.com/piekstra/cli-common", tag = "v0.29.0" }
pk-cli-selfupdate = { git = "https://github.com/piekstra/cli-common", tag = "v0.29.0" }
pk-cli-auth = { git = "https://github.com/piekstra/cli-common", tag = "v0.29.0" }
pk-cli-http = { git = "https://github.com/piekstra/cli-common", tag = "v0.29.0" }
pk-cli-utility = { git = "https://github.com/piekstra/cli-common", tag = "v0.29.0", features = ["mcp"] }
# `cpmfl mcp`: read-only tools for Claude over stdio or 127.0.0.1 (DESIGN.md §1.9).
pk-cli-mcp = { git = "https://github.com/piekstra/cli-common", tag = "v0.29.0", features = ["stdio", "http"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[dev-dependencies]
# The MCP profile's conformance checks, for the tests only.
pk-cli-mcp = { git = "https://github.com/piekstra/cli-common", tag = "v0.29.0", features = ["test-util"] }
assert_cmd = "2"
predicates = "3"

[profile.release]
strip = true
lto = true
opt-level = "z"
